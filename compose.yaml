# Demo deployment: one container behind the shared Caddy (network work-services_apps).
# Secrets (META_MODEL_API_KEY, BASETEN_API_KEY) live in .env next to this file, never in git.
services:
  curtain-tryon:
    build: .
    restart: unless-stopped
    env_file: .env
    # Running try-ons take up to two minutes; the server finishes them before it exits on a restart.
    stop_grace_period: 180s
    environment:
      PORT: "8080"
      SPEND_CAP_USD_PER_DAY: "${SPEND_CAP_USD_PER_DAY:-10}"
      SPEND_FILE: /data/spend.json
      GALLERY_DIR: /app/gallery
    volumes:
      - ./data:/data
      - ./gallery:/app/gallery:ro
    mem_limit: 1g
    cpus: 1.5
    # Node needs no Linux capabilities to listen on 8080 as the node user, and nothing in it should gain any.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [apps]
networks:
  apps:
    external: true
    name: work-services_apps
